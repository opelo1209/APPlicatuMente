services:
  postgres-temporal:
    image: postgres:16
    container_name: aptm_front_postgres_temporal
    ports:
      - "55432:55432"
    command: ["postgres", "-c", "port=55432"]
    environment:
      POSTGRES_DB: aptm_tmp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGPORT: 55432
    volumes:
      - aptm_front_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 55432 -U postgres -d aptm_tmp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mini-backend:
    build:
      context: ./mock_backend
      dockerfile: Dockerfile
    container_name: aptm_front_mini_backend
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-temporal:55432/aptm_tmp
    depends_on:
      postgres-temporal:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8001}
    container_name: aptm_frontend
    ports:
      - "8080:8080"
    depends_on:
      - mini-backend
    restart: unless-stopped

volumes:
  aptm_front_pgdata:
