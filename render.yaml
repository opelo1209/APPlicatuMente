databases:
  - name: aptm-db
    plan: free
    databaseName: aptm_tmp
    user: aptm_user

services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: aptm-backend
    runtime: docker
    dockerfilePath: ./mock_backend/Dockerfile
    dockerContext: ./mock_backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aptm-db
          property: connectionString

  # ── Frontend (Flutter Web + Nginx) ────────────────────────────────────────
  # NOTE: After this deploys, go to aptm-frontend -> Settings -> Docker Build Args
  # and set API_BASE_URL to the real backend URL (e.g. https://aptm-backend.onrender.com)
  # then trigger a manual redeploy.
  - type: web
    name: aptm-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
