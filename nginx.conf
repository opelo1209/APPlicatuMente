server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Service worker: no-cache so the browser always revalidates on reload,
  # but allows the SW to serve cached content between visits.
  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  # Main entry point: always fetch fresh so updated SW is detected.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Flutter bootstrap and version manifest: no-cache.
  location ~* ^/(flutter_bootstrap\.js|flutter\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Flutter's main bundle is not content-hashed in this build; force
  # revalidation so UI changes are visible after redeploys.
  location = /main.dart.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Hashed static assets (Flutter appends content hash to filenames):
  # safe to cache for a long time.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|mp3|gif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback for Flutter router.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
