server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # PWA service worker (web/pwa_sw.js). Existe para habilitar la instalacion;
  # no cachea codigo de la app. Debe revalidarse siempre: un SW cacheado por la
  # regla generica de estaticos (1 ano, immutable) quedaria congelado.
  # Un `location =` tiene prioridad sobre las expresiones regulares en nginx.
  location = /pwa_sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  # Pagina de respaldo sin conexion que sirve el service worker.
  location = /offline.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Main entry point: always fetch fresh so updated SW is detected.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Flutter bootstrap and version manifest: no-cache.
  location ~* ^/(flutter_bootstrap\.js|flutter\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Flutter's main bundle is not content-hashed in this build; force
  # revalidation so UI changes are visible after redeploys.
  location = /main.dart.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Hashed static assets (Flutter appends content hash to filenames):
  # safe to cache for a long time.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|mp3|gif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # SPA fallback for Flutter router.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
