<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APTM · Sin conexión</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    :root {
      --fondo: #F1F8E9;
      --superficie: #FFFFFF;
      --texto: #263238;
      --texto-suave: #5C6B73;
      --verde: #66BB6A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #121A16;
        --superficie: #1C2620;
        --texto: #E8F0EA;
        --texto-suave: #A0B0A6;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 26rem;
      text-align: center;
      background: var(--superficie);
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    img { width: 88px; height: 88px; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    p { margin: 0 0 24px; color: var(--texto-suave); line-height: 1.6; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 32px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--verde);
      cursor: pointer;
      transition: transform 150ms ease, filter 150ms ease;
    }
    button:hover { filter: brightness(1.06); }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid var(--verde); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/Icon-192.png" alt="">
    <h1>Sin conexión</h1>
    <p>
      APPlicatuMente necesita internet para acompañarte.
      Revisa tu conexión y vuelve a intentarlo.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
