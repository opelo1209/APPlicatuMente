<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Limpiar cache APTM</title>
</head>
<body>
  <p>Limpiando cache de APTM...</p>
  <script>
    (async function resetAptmCache() {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }

      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }

      localStorage.removeItem('flutter.flutterVersion');
      sessionStorage.clear();
      document.body.innerHTML = '<p>Cache limpio. Redirigiendo al front...</p>';
      window.location.replace('/?v=aptm_roles_admin_questions_20260518');
    })();
  </script>
</body>
</html>
